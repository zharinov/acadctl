[workspace]
members = [
    "crates/cli",
    "crates/lisp",
    "crates/rpc",
    "crates/plugin",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
version = "0.7.2"

[workspace.dependencies]
bytes = "1.11.1"
clap = { version = "4.6.6", features = ["derive"] }
cxx = "1.0.199"
cxx-build = "1.0.199"
futures-util = "0.3.31"
hyper-util = { version = "0.1.17", features = ["tokio"] }
nanoid = "0.4.0"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSAppleEventDescriptor", "NSDate", "NSError", "NSPathUtilities", "NSString", "alloc", "libc", "objc2-core-services"] }
prost = "0.14.1"
protoc-bin-vendored = "3.2.0"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5.2", features = ["util"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
