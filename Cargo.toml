[workspace]
members = [
    "crates/cli",
    "crates/lisp",
    "crates/rpc",
    "crates/plugin",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
version = "0.7.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
needless_pass_by_ref_mut = "deny"
redundant_clone = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
wildcard_dependencies = "deny"

[workspace.metadata.cargo-shear]
ignored = ["tonic-prost"]
ignored-paths = [
    "crates/cli/src/process/macos.rs",
    "crates/cli/src/process/unsupported.rs",
    "crates/cli/src/process/windows.rs",
]

[workspace.dependencies]
bytes = "1.11.1"
camino = "1.2.2"
clap = { version = "4.6.6", features = ["derive"] }
cxx = "1.0.199"
cxx-build = "1.0.199"
futures-util = "0.3.31"
hyper-util = { version = "0.1.17", features = ["tokio"] }
libc = "0.2.183"
nanoid = "0.4.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSPathUtilities", "NSString", "alloc"] }
prost = "0.14.1"
protoc-bin-vendored = "3.2.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5.2", features = ["util"] }
unicode-width = "0.2.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
