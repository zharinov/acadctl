syntax = "proto3";

package acadctl;

service DrawingService {
  rpc List(ListRequest) returns (ListResponse);
  rpc Open(OpenRequest) returns (OpenResponse);
  rpc Save(SaveRequest) returns (SaveResponse);
  rpc Undo(HistoryRequest) returns (HistoryResponse);
  rpc Redo(HistoryRequest) returns (HistoryResponse);
  rpc Close(CloseRequest) returns (CloseResponse);
}

service ExecService {
  rpc Execute(stream ExecClientMessage) returns (stream ExecServerEvent);
}

message ListRequest {}

message ListResponse { repeated Drawing drawings = 1; }

message OpenRequest { string path = 1; }

message OpenResponse { Drawing drawing = 1; }

message SaveRequest {
  uint32 drawing_id = 1;
  optional string path = 2;
}

message SaveResponse { Drawing drawing = 1; }

message HistoryRequest { uint32 drawing_id = 1; }

message HistoryResponse { Drawing drawing = 1; }

message CloseRequest {
  uint32 drawing_id = 1;
  bool discard = 2;
}

message CloseResponse {}

message ExecClientMessage {
  oneof message {
    ExecRequest request = 1;
    ExecCancelRequest cancel = 2;
  }
}

message ExecRequest {
  uint32 drawing_id = 1;
  ExecMode mode = 2;
  string source_name = 3;
  bytes source = 4;
}

enum ExecMode {
  EXEC_MODE_UNSPECIFIED = 0;
  EXEC_MODE_EVAL = 1;
  EXEC_MODE_EXEC = 2;
}

message ExecCancelRequest {}

message ExecServerEvent {
  oneof event {
    ExecAccepted accepted = 1;
    ExecOutput output = 2;
    ExecFinished finished = 3;
    ExecCancelAcknowledgement cancel_acknowledgement = 4;
  }
}

message ExecAccepted {}

message ExecOutput { string chunk = 1; }

message ExecFinished { ExecOutcome outcome = 1; }

message ExecOutcome {
  oneof outcome {
    ExecSuccess success = 1;
    ExecFailure failure = 2;
    ExecCancelled cancelled = 3;
  }
}

message ExecSuccess {}

message ExecCancelled {}

message ExecCancelAcknowledgement { ExecCancelDisposition disposition = 1; }

enum ExecCancelDisposition {
  EXEC_CANCEL_DISPOSITION_UNSPECIFIED = 0;
  EXEC_CANCEL_DISPOSITION_ACCEPTED = 1;
  EXEC_CANCEL_DISPOSITION_TOO_LATE = 2;
}

message ExecFailure {
  string message = 1;
  optional uint64 form_index = 2;
  SourceLocation location = 3;
  DrawingOutcome drawing_outcome = 4;
  DrawingErrorKind drawing_error = 5;
}

message SourceLocation {
  string source_name = 1;
  uint64 line = 2;
  uint64 column = 3;
}

enum DrawingOutcome {
  DRAWING_OUTCOME_UNSPECIFIED = 0;
  DRAWING_OUTCOME_NOT_STARTED = 1;
  DRAWING_OUTCOME_ROLLED_BACK = 2;
  DRAWING_OUTCOME_COMMITTED = 3;
  DRAWING_OUTCOME_UNKNOWN = 4;
}

message DrawingError {
  DrawingErrorKind kind = 1;
  optional uint32 drawing_id = 2;
}

enum DrawingErrorKind {
  DRAWING_ERROR_KIND_UNSPECIFIED = 0;
  DRAWING_ERROR_KIND_NOT_OPEN = 1;
  DRAWING_ERROR_KIND_REPLACED = 2;
  DRAWING_ERROR_KIND_READ_ONLY = 3;
  DRAWING_ERROR_KIND_UNSAVED_CHANGES = 4;
  DRAWING_ERROR_KIND_NO_FILE_NAME = 5;
  DRAWING_ERROR_KIND_BUSY = 6;
  DRAWING_ERROR_KIND_UNDO_DISABLED = 7;
  DRAWING_ERROR_KIND_DESTINATION_EXISTS = 8;
  DRAWING_ERROR_KIND_READINESS_TIMED_OUT = 9;
}

message Drawing {
  uint32 id = 1;
  string display_name = 2;
  optional string file_path = 3;
  bool modified = 4;
  bool read_only = 5;
}
