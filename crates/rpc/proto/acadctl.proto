syntax = "proto3";

package acadctl;

service DocumentService {
  rpc List(ListRequest) returns (ListResponse);
  rpc Open(OpenRequest) returns (OpenResponse);
  rpc Save(SaveRequest) returns (SaveResponse);
  rpc Undo(HistoryRequest) returns (HistoryResponse);
  rpc Redo(HistoryRequest) returns (HistoryResponse);
  rpc Close(CloseRequest) returns (CloseResponse);
}

service ExecutionService {
  rpc Execute(stream ExecutionClientMessage) returns (stream ExecutionServerEvent);
}

message ListRequest {}

message ListResponse {
  repeated Document documents = 1;
}

message OpenRequest {
  string path = 1;
}

message OpenResponse {
  Document document = 1;
}

message SaveRequest {
  string id = 1;
}

message SaveResponse {
  Document document = 1;
}

message HistoryRequest {
  string id = 1;
}

message HistoryResponse {
  Document document = 1;
}

message CloseRequest {
  string id = 1;
  bool discard = 2;
}

message CloseResponse {}

message ExecutionClientMessage {
  oneof message {
    ExecutionRequest request = 1;
    ExecutionCancelRequest cancel = 2;
  }
}

message ExecutionRequest {
  string document_id = 1;
  ExecutionMode mode = 2;
  string source_name = 3;
  bytes source = 4;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_EVAL = 1;
  EXECUTION_MODE_EXEC = 2;
}

message ExecutionCancelRequest {}

message ExecutionServerEvent {
  oneof event {
    ExecutionAccepted accepted = 1;
    ExecutionOutput output = 2;
    ExecutionFinished finished = 3;
    ExecutionCancelAcknowledgement cancel_acknowledgement = 4;
  }
}

message ExecutionAccepted {}

message ExecutionOutput {
  string chunk = 1;
}

message ExecutionFinished {
  ExecutionOutcome outcome = 1;
}

message ExecutionOutcome {
  oneof outcome {
    ExecutionSuccess success = 1;
    ExecutionFailure failure = 2;
    ExecutionCancelled cancelled = 3;
  }
}

message ExecutionSuccess {}

message ExecutionCancelled {}

message ExecutionCancelAcknowledgement {
  ExecutionCancelDisposition disposition = 1;
}

enum ExecutionCancelDisposition {
  EXECUTION_CANCEL_DISPOSITION_UNSPECIFIED = 0;
  EXECUTION_CANCEL_DISPOSITION_ACCEPTED = 1;
  EXECUTION_CANCEL_DISPOSITION_TOO_LATE = 2;
}

message ExecutionFailure {
  string message = 1;
  optional uint64 form_index = 2;
  SourceLocation location = 3;
  DrawingOutcome drawing_outcome = 4;
}

message SourceLocation {
  string source_name = 1;
  uint64 line = 2;
  uint64 column = 3;
}

enum DrawingOutcome {
  DRAWING_OUTCOME_UNSPECIFIED = 0;
  DRAWING_OUTCOME_NOT_STARTED = 1;
  DRAWING_OUTCOME_ROLLED_BACK = 2;
  DRAWING_OUTCOME_COMMITTED = 3;
  DRAWING_OUTCOME_UNKNOWN = 4;
}

message Document {
  string id = 1;
  string display_name = 2;
  optional string file_path = 3;
  bool modified = 4;
  bool read_only = 5;
}
